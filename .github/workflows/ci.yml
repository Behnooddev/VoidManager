name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      # Every step below runs even when an earlier one failed, and Gradle keeps going after the
      # first failing task, so one run reports as many problems as possible.
      - name: Version consistency
        if: ${{ !cancelled() }}
        run: bash ./scripts/check-version-consistency.sh
      - name: Format check
        if: ${{ !cancelled() }}
        run: ./gradlew --continue spotlessCheck
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: >
          ./gradlew --continue
          :core:common:jvmTest :core:model:jvmTest :core:data:jvmTest :core:database:jvmTest
          :core:security:jvmTest :core:crypto:test
      - name: Build shared modules
        if: ${{ !cancelled() }}
        run: >
          ./gradlew --continue
          :core:model:assemble :core:database:assemble :core:data:assemble
          :core:security:assemble :core:crypto:assemble
      - name: Install Android platform 37
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" || true
      - name: Android debug build and lint
        if: ${{ !cancelled() }}
        run: ./gradlew --continue :app:android:assembleDebug :app:android:lintDebug
      - name: Desktop compile
        if: ${{ !cancelled() }}
        run: ./gradlew --continue :app:desktop:classes

      - name: Upload debug APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/android/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
